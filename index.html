<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <div>
        <div id="resolution-container">
            <div>
                The width in pixels:
                <input type="number" id="resx" value="500">
            </div>
            <div>
                The height in pixels:
                <input type="number" id="resy" value="500">
            </div>
        </div>
        <div>
            Get random starting positions:
            <input type="checkbox" id="mode">
        </div>
        <div id="startingPoints-container">
            Amount of starting points:
            <input type="number" id="objectCount" value="4">
        </div>
        <div>
            Amount of iterations:
            <input type="number" id="iterations" value="10">
        </div>
        <div>
            Starting line length:
            <input type="number" id="lineLength" value="100">
        </div>

        <button id="generate">Generate</button>
        <button id="download">download</button>
    </div>
    

    <canvas id="canvas" height="500" width="500"></canvas>
    <script src="index.js"></script>
</body>
</html>
